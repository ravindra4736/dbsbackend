<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBS Backend Admin</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
        color: #f8fafc;
      }
      .container {
        max-width: 760px;
        padding: 2rem;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.92);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2.2rem;
      }
      p {
        line-height: 1.7;
        margin: 0.75rem 0;
      }
      code {
        background: rgba(148, 163, 184, 0.12);
        padding: 0.15rem 0.4rem;
        border-radius: 0.4rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DBS Backend Admin Panel</h1>
      <p>This is the admin frontend entrypoint for <strong>http://dbsbackend.local/</strong>.</p>
      <p>API base path is <code>/api/v1/</code>.</p>
      <p>Current admin dashboard routes can be built as frontend pages or mounted as controllers under root.</p>
    </div>
  </body>
</html>
